[project]
name = "ac-infinity-ble"
version = "1.0.0"
description = "AC Infinity BLE Controller"
authors = [{name = "Jason Hunter", email = "hunterjm@gmail.com"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = ["bleak>=3.0.2,<4.0", "bleak-retry-connector>=4.7.0,<5.0"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Repository = "https://github.com/hunterjm/ac-infinity-ble"
Documentation = "https://ac-infinity-ble.readthedocs.io"
"Bug Tracker" = "https://github.com/hunterjm/ac-infinity-ble/issues"
Changelog = "https://github.com/hunterjm/ac-infinity-ble/blob/main/CHANGELOG.md"

[tool.poetry]
packages = [{include = "ac_infinity_ble", from = "src"}]

[tool.poetry.group.dev.dependencies]
pytest = ">=8,<10"
pytest-cov = ">=6,<8"
ruff = "==0.16.8"
mypy = "==2.3.1"
python-semantic-release = "==10.6.2"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
myst-parser = ">=5,<6"
sphinx = ">=9,<10"
sphinx-rtd-theme = ">=3,<4"
sphinxcontrib-mermaid = ">=2,<3"

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/ac_infinity_ble/__init__.py:__version__"]
build_command = "poetry build"
commit_message = "chore(release): {version} [skip ci]"
allow_zero_version = false

[tool.semantic_release.branches.main]
match = "main"

[tool.pytest.ini_options]
addopts = "-v -Wdefault"
pythonpath = ["src"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "@overload",
    "if TYPE_CHECKING",
    "raise NotImplementedError",
    'if __name__ == "__main__":',
]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF100"]

[tool.ruff.lint.isort]
known-first-party = ["ac_infinity_ble", "tests"]

[tool.mypy]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
mypy_path = "src/"
no_implicit_optional = true
show_error_codes = true
warn_unreachable = true
warn_unused_ignores = true
exclude = [
    'docs/.*',
    'setup.py',
]

[[tool.mypy.overrides]]
module = "tests.*"
allow_untyped_defs = true

[[tool.mypy.overrides]]
module = "docs.*"
ignore_errors = true

[build-system]
requires = ["poetry-core>=2.2.0"]
build-backend = "poetry.core.masonry.api"
